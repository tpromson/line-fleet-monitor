services:
  - type: web
    name: line-fleet-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: MOPH_ALERT_ENABLED
        value: "false"
      - key: MOPH_ALERT_TOKEN_URL
        value: https://cvp1.moph.go.th/token
      - key: MOPH_ALERT_BASE_URL
        value: https://morpromt2c.moph.go.th
      - key: MOPH_ALERT_USER
        sync: false
      - key: MOPH_ALERT_PASSWORD_HASH
        sync: false
      - key: MOPH_ALERT_HOSPITAL_CODE
        sync: false
      - key: MOPH_ALERT_CIDS
        sync: false
      - key: MOPH_NOTIFY_ENABLED
        value: "true"
      - key: MOPH_NOTIFY_URL
        value: https://morpromt2f.moph.go.th/api/notify/send
      - key: MOPH_NOTIFY_CLIENT_KEY
        sync: false
      - key: MOPH_NOTIFY_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PORT
        value: 3001
